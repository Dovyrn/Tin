[workspace]
members = ["crates/metal"]

[workspace.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
objc2-quartz-core = "0.3"
block2 = "0.6"

[package]
name = "tin"
version = "0.1.0"
edition = "2021"

[lib]
name = "tin_native"
crate-type = ["cdylib"]

[dependencies]
tin-metal = { path = "crates/metal" }
jni = "0.22"

[profile.release]
lto = true
