[workspace]
members = ["crates/metal"]

[workspace.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
objc2-quartz-core = { version = "0.3", features = ["objc2-metal"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSResponder", "objc2-quartz-core"] }
block2 = "0.6"

[package]
name = "tin-jni"
version = "0.1.0"
edition = "2021"

[lib]
name = "tin_native"
crate-type = ["cdylib"]

[dependencies]
tin-metal = { path = "crates/metal" }
jni = "0.22"
objc2-app-kit = { workspace = true }

[profile.release]
lto = true
