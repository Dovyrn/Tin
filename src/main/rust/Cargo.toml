[package]
name = "tin-shaders"
version = "0.1.0"
edition = "2021"

[lib]
name = "tin_shaders"
crate-type = ["cdylib"]

[dependencies]
spirv-cross2 = { version = "0.7", default-features = false, features = ["msl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
